<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#3b82f6">
<title>我的财务</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── 顶部栏 ── -->
  <header class="header">
    <div class="header-inner">
      <h1 class="header-title">💰 我的财务</h1>
      <div class="header-date" id="todayDate"></div>
    </div>
  </header>

  <!-- ── 主内容区 ── -->
  <main class="main" id="mainContent">
    <!-- 内容由 JS 动态渲染 -->
  </main>

  <!-- ── 底部导航 ── -->
  <nav class="tabbar">
    <button class="tab-item active" data-page="dashboard">
      <span class="tab-icon">📊</span>
      <span class="tab-label">概览</span>
    </button>
    <button class="tab-item" data-page="records">
      <span class="tab-icon">📋</span>
      <span class="tab-label">记录</span>
    </button>
    <button class="tab-fab" id="fabAdd">
      <span>+</span>
    </button>
    <button class="tab-item" data-page="calendar">
      <span class="tab-icon">📅</span>
      <span class="tab-label">日历</span>
    </button>
    <button class="tab-item" data-page="categories">
      <span class="tab-icon">🏷️</span>
      <span class="tab-label">分类</span>
    </button>
  </nav>

  <!-- ── 新增/编辑记账弹窗 ── -->
  <div class="modal-mask" id="recordModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="modalTitle">新增记账</h2>
        <button class="modal-close" id="modalClose">×</button>
      </div>

      <div class="modal-body">
        <!-- 类型切换 -->
        <div class="type-switch">
          <button class="type-btn active" data-type="expense">支出</button>
          <button class="type-btn" data-type="income">收入</button>
        </div>

        <!-- 金额输入 -->
        <div class="amount-input-wrap">
          <span class="amount-symbol">¥</span>
          <input type="number" class="amount-input" id="amountInput" placeholder="0.00" step="0.01" inputmode="decimal">
        </div>

        <!-- 分类选择 -->
        <div class="form-label">分类</div>
        <div class="category-grid" id="categoryGrid"></div>

        <!-- 日期 -->
        <div class="form-label">日期</div>
        <input type="date" class="form-input" id="dateInput">

        <!-- 备注 -->
        <div class="form-label">备注</div>
        <input type="text" class="form-input" id="noteInput" placeholder="添加备注（可选）" maxlength="50">

        <!-- 保存按钮 -->
        <button class="save-btn" id="saveBtn">保存</button>
        <button class="delete-btn" id="deleteBtn" style="display:none;">删除此记录</button>
      </div>
    </div>
  </div>

  <!-- ── 分类管理弹窗 ── -->
  <div class="modal-mask" id="categoryModal">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="catModalTitle">新增分类</h2>
        <button class="modal-close" id="catModalClose">×</button>
      </div>
      <div class="modal-body">
        <div class="type-switch">
          <button class="type-btn active" data-type="expense">支出</button>
          <button class="type-btn" data-type="income">收入</button>
        </div>
        <div class="form-label">图标</div>
        <div class="emoji-picker" id="emojiPicker"></div>
        <div class="form-label">名称</div>
        <input type="text" class="form-input" id="catNameInput" placeholder="分类名称" maxlength="10">
        <button class="save-btn" id="catSaveBtn">保存</button>
        <button class="delete-btn" id="catDeleteBtn" style="display:none;">删除此分类</button>
      </div>
    </div>
  </div>

  <!-- ── Toast 提示 ── -->
  <div class="toast" id="toast"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
